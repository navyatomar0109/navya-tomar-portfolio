kind = "web"
previewPath = "/"
title = "Navya Tomar Portfolio"
description = "A polished personal portfolio for Navya Tomar, showcasing her experience, student leadership, social volunteering, hackathon participation, achievements, and certificates."
version = "1.0.0"
id = "artifacts/navya-tomar-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23270

[services.development]
run = "pnpm --filter @workspace/navya-tomar-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/navya-tomar-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/navya-tomar-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23270"
BASE_PATH = "/"
